# Roda a suíte a cada push. Fica vermelho se um teste quebrar.
# Sobe o produto do zero, numa máquina limpa, e só testa: não publica nada.
name: testes
on: [push]
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sobe o produto
        run: docker compose up -d --build --wait
      - name: Roda a suíte
        run: node --test
      - name: Mostra o log se falhar
        if: failure()
        run: docker compose logs --tail=50
