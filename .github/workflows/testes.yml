# Roda a suíte a cada push. Fica vermelho se um teste quebrar, se houver segredo no
# histórico ou se uma dependência tiver vulnerabilidade alta.
# Sobe o produto do zero, numa máquina limpa, e só testa: não publica nada.
name: testes
on: [push]
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # fetch-depth 0 traz o histórico inteiro: a varredura de segredos lê todos os commits,
      # porque apagar o segredo do arquivo não o apaga do histórico.
      # Action travada pelo hash do commit, não pela tag: tag pode ser movida para outro código
      # (ataque de cadeia de suprimento). O comentário diz a versão; atualizar é trocar os dois.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # Segurança antes dos testes (docs/seguranca-enc15.md). Os dois passos falham o pipeline:
      # segredo no histórico (TruffleHog, sem testar a chave no provedor) e dependência com
      # vulnerabilidade alta ou crítica (npm audit, contra a versão travada no package-lock.json).
      - name: Segredos no histórico
        # Imagem travada pelo digest, pela mesma razão das actions (versão 3.100.1).
        run: docker run --rm -v "$PWD:/repo" trufflesecurity/trufflehog@sha256:9c7a8325d43a4af2960d3f21d61a08981d8a1bf0542e007efa2e47097e386452 git file:///repo --no-verification --no-update --fail
      - name: Dependências auditadas
        run: npm audit --audit-level=high
      # Sem este passo, o pipeline ficaria verde com zero testes:
      # o "node --test" termina em sucesso quando não acha nenhum arquivo.
      - name: Confere que há testes para rodar
        run: ls producao/testes/*.test.js testes/*.test.js
      # A base da pirâmide primeiro: a regra sozinha, sem banco e sem rede. Termina em 1 segundo.
      # Se a regra quebrou, o pipeline para aqui, antes de gastar tempo subindo o produto.
      - name: Testes de unidade
        run: node --test "producao/testes/*.test.js"
      - name: Sobe o produto
        run: docker compose up -d --build --wait
      # Um arquivo de teste por vez: o teste da fila enche o limite de um tenant,
      # e não pode rodar junto com outro que use o mesmo tenant.
      - name: Testes com o produto no ar
        run: node --test --test-concurrency=1 "testes/*.test.js"
      - name: Mostra o log se falhar
        if: failure()
        run: docker compose logs --tail=50
